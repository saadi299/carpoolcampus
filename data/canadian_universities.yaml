# Reference data for seeding organizations and campuses.
#
# Real, public information: organization names, campus names, campus street
# addresses, postal codes and student/staff email domains.
# Coordinates are approximate (good to a few hundred metres) and are only used
# for distance estimates.
#
# `nearby_fsas` lists real Forward Sortation Areas (first 3 characters of a
# Canadian postal code) around each campus. The seed command uses them to give
# fake demo students believable home postal codes.
#
# To add an organization: copy a block, fill it in, run `python manage.py seed`.

organizations:
  - code: ontariotech
    name: Ontario Tech University
    province: ON
    email_domains: [ontariotechu.net, ontariotechu.ca]
    course_code_style: "{SUBJ} {NUM}U"   # e.g. SOFE 3980U
    subjects: [SOFE, ENGR, BUSI, CSCI, MATH, PHY, HLSC, NURS]
    campuses:
      - name: North Oshawa
        address: 2000 Simcoe St N, Oshawa, ON
        postal_code: L1G 0C5
        lat: 43.9455
        lng: -78.8964
        nearby_fsas: [L1G, L1H, L1J, L1K, L1L, L1N, L1R, L1M, L1T, L1S, M1B, M1C]
      - name: Downtown Oshawa
