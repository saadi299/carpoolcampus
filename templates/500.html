{% extends "base.html" %}

{% block title %}Server Error — CarpoolCampus{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-12 text-center px-4">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 text-red-600 mb-6">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
  </div>
  <h1 class="text-3xl font-bold text-gray-900 mb-3">Something went wrong</h1>
  <p class="text-gray-600 mb-8">
    We experienced an internal server error while processing your request. Please try again later.
  </p>
  <a href="/" class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors duration-150">
    Return to Home
  </a>
</div>
{% endblock %}
